spring.application.name=prosefa-backend
port=8080
spring.config.import=file:.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/prosefa_db
spring.datasource.username=${PROSEFA_DB_USER}
spring.datasource.password=${PROSEFA_DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Adicione esta linha
springdoc.api-docs.version=OPENAPI_3_0

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs